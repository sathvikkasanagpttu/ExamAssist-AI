version: '3.8'

services:
  examassist-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: examassist-backend
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - NODE_ENV=production
      - RATE_LIMIT_PER_MINUTE=120
      - CORS_ALLOWED_ORIGINS=http://localhost:8787,chrome-extension://*
      # Pass through optional API keys from local .env if provided
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
