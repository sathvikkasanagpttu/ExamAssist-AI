services:
  course-notes-db:
    image: pgvector/pgvector:pg16
    container_name: examassist-course-notes-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examassist}
      POSTGRES_USER: ${POSTGRES_USER:-examassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - course-notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examassist} -d ${POSTGRES_DB:-examassist}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  examassist-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: examassist-backend
    networks: [backend, default]
    depends_on:
      course-notes-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EXAMASSIST_HOST_PORT:-8787}:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - NODE_ENV=production
      - RATE_LIMIT_PER_MINUTE=120
      - KB_DATABASE_URL=postgresql://${POSTGRES_USER:-examassist}:${POSTGRES_PASSWORD:-local-dev-only}@course-notes-db:5432/${POSTGRES_DB:-examassist}
      - KB_MAX_UPLOAD_BYTES=${KB_MAX_UPLOAD_BYTES:-10485760}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - CORS_ALLOWED_ORIGINS=http://localhost:8787,chrome-extension://*
      - SANDBOX_URL=http://examassist-sandbox:8790
      - SANDBOX_TIMEOUT_MS=${SANDBOX_TIMEOUT_MS:-2000}
      - AGENT_MAX_USD=${AGENT_MAX_USD:-0.05}
      - AGENT_COST_PER_1K_TOKENS_USD=${AGENT_COST_PER_1K_TOKENS_USD:-}
      # Pass through optional API keys from local .env if provided
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  examassist-sandbox:
    build:
      context: ./server/sandbox
      dockerfile: Dockerfile
    container_name: examassist-sandbox
    ports:
      - "127.0.0.1:8791:8790"
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETPCAP, SYS_ADMIN, NET_ADMIN, CHOWN]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 96
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  course-notes-data:
