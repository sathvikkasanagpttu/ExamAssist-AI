<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="320">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <style>
      .stage-1 { animation: stageFloat 4s ease-in-out infinite 0s; }
      .stage-2 { animation: stageFloat 4s ease-in-out infinite 0.5s; }
      .stage-3 { animation: stageFloat 4s ease-in-out infinite 1.0s; }
      .stage-4 { animation: stageFloat 4s ease-in-out infinite 1.5s; }
      .stage-5 { animation: stageFloat 4s ease-in-out infinite 2.0s; }
      .flow-line { stroke-dasharray: 7 7; animation: flowAnim 1.2s linear infinite; }
      @keyframes stageFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes flowAnim {
        to { stroke-dashoffset: -28; }
      }
      .hdr { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .step-num { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 800; font-size: 11px; }
    </style>
  </defs>

  <rect width="1100" height="320" rx="18" fill="url(#pipeBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="550" y="36" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="16" fill="#e2e8f0" letter-spacing="1">
    3D ISOMETRIC MULTI-STAGE VERIFICATION PIPELINE (REAL-TIME SSE STREAM)
  </text>

  <!-- Animated Data Flow Connectors -->
  <path d="M 210 165 L 265 165" stroke="#38bdf8" stroke-width="2.5" class="flow-line"/>
  <path d="M 425 165 L 480 165" stroke="#a855f7" stroke-width="2.5" class="flow-line"/>
  <path d="M 640 165 L 695 165" stroke="#f59e0b" stroke-width="2.5" class="flow-line"/>
  <path d="M 855 165 L 910 165" stroke="#10b981" stroke-width="2.5" class="flow-line"/>

  <!-- STAGE 1: Extract & Classify -->
  <g class="stage-1" filter="url(#cardShadow)">
    <!-- 3D Extrusion Base -->
    <rect x="44" y="98" width="166" height="148" rx="12" fill="#0284c7" opacity="0.35"/>
    <rect x="38" y="90" width="166" height="148" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="52" y="104" width="68" height="20" rx="6" fill="rgba(56,189,248,0.15)"/>
    <text x="60" y="118" class="step-num" fill="#38bdf8">STAGE 01</text>
    <text x="52" y="145" class="hdr">Classify &amp; Gate</text>
    <text x="52" y="166" class="sub">• 10 Question Families</text>
    <text x="52" y="184" class="sub">• Quality Gate Check</text>
    <text x="52" y="202" class="sub">• Option Integrity</text>
    <text x="52" y="220" class="sub" fill="#38bdf8">event: classified</text>
  </g>

  <!-- STAGE 2: Hybrid Retrieval -->
  <g class="stage-2" filter="url(#cardShadow)">
    <rect x="259" y="98" width="166" height="148" rx="12" fill="#7e22ce" opacity="0.35"/>
    <rect x="253" y="90" width="166" height="148" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.6"/>
    <rect x="267" y="104" width="68" height="20" rx="6" fill="rgba(168,85,247,0.15)"/>
    <text x="275" y="118" class="step-num" fill="#c084fc">STAGE 02</text>
    <text x="267" y="145" class="hdr">Hybrid Evidence</text>
    <text x="267" y="166" class="sub">• Web Search + Wiki</text>
    <text x="267" y="184" class="sub">• Private Notes RAG</text>
    <text x="267" y="202" class="sub">• RRF Hybrid Rerank</text>
    <text x="267" y="220" class="sub" fill="#c084fc">event: retrieved</text>
  </g>

  <!-- STAGE 3: Solve-First & Tools -->
  <g class="stage-3" filter="url(#cardShadow)">
    <rect x="474" y="98" width="166" height="148" rx="12" fill="#d97706" opacity="0.35"/>
    <rect x="468" y="90" width="166" height="148" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="482" y="104" width="68" height="20" rx="6" fill="rgba(245,158,11,0.15)"/>
    <text x="490" y="118" class="step-num" fill="#fbbf24">STAGE 03</text>
    <text x="482" y="145" class="hdr">Solve &amp; Execute</text>
    <text x="482" y="166" class="sub">• Pass 1 (No Evidence)</text>
    <text x="482" y="184" class="sub">• Pass 2 + Tie-Break</text>
    <text x="482" y="202" class="sub">• Math / Code / SQL</text>
    <text x="482" y="220" class="sub" fill="#fbbf24">event: solving</text>
  </g>

  <!-- STAGE 4: Claim Verification -->
  <g class="stage-4" filter="url(#cardShadow)">
    <rect x="689" y="98" width="166" height="148" rx="12" fill="#e11d48" opacity="0.35"/>
    <rect x="683" y="90" width="166" height="148" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.6"/>
    <rect x="697" y="104" width="68" height="20" rx="6" fill="rgba(244,63,94,0.15)"/>
    <text x="705" y="118" class="step-num" fill="#fb7185">STAGE 04</text>
    <text x="697" y="145" class="hdr">Cross-Verify</text>
    <text x="697" y="166" class="sub">• Claim-by-Claim Check</text>
    <text x="697" y="184" class="sub">• Conflict Detection</text>
    <text x="697" y="202" class="sub">• Tool Mismatch Audit</text>
    <text x="697" y="220" class="sub" fill="#fb7185">event: verifying</text>
  </g>

  <!-- STAGE 5: Calibrated Output -->
  <g class="stage-5" filter="url(#cardShadow)">
    <rect x="904" y="98" width="162" height="148" rx="12" fill="#059669" opacity="0.35"/>
    <rect x="898" y="90" width="162" height="148" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.6"/>
    <rect x="912" y="104" width="68" height="20" rx="6" fill="rgba(16,185,129,0.15)"/>
    <text x="920" y="118" class="step-num" fill="#34d399">STAGE 05</text>
    <text x="912" y="145" class="hdr">Calibrated UI</text>
    <text x="912" y="166" class="sub">• min(Engine, Model)</text>
    <text x="912" y="184" class="sub">• Verified Tool Badges</text>
    <text x="912" y="202" class="sub">• Citation Cards</text>
    <text x="912" y="220" class="sub" fill="#34d399">event: done</text>
  </g>

  <!-- Bottom Legend Bar -->
  <rect x="38" y="266" width="1022" height="34" rx="8" fill="rgba(15,23,42,0.9)" stroke="#1e293b"/>
  <text x="550" y="288" text-anchor="middle" class="sub" fill="#cbd5e1">
    🔒 Zero Silent Fallbacks • Every claim is cross-checked against retrieved web sources, private pgvector course notes, and deterministic execution tools.
  </text>
</svg>
