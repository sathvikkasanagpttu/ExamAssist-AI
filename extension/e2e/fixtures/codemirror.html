<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CodeMirror 6 Fixture — LeetCode Style</title>
</head>
<body>
  <div class="question-content">
    <div data-cy="question-title">Climbing Stairs</div>
    <div data-track-load="description_content">
      You are climbing a staircase. It takes n steps to reach the top. Each time you can either climb 1 or 2 steps.
      Constraints:
      1 &lt;= n &lt;= 45
      Input:
      3
      Output:
      3
    </div>
    <div id="host-codemirror" class="cm-editor" data-language="javascript">
      <div class="cm-content" contenteditable="true">
        <div class="cm-line">function climbStairs(n) {</div>
        <div class="cm-line">  if (n &lt;= 2) return n;</div>
        <div class="cm-line">  return climbStairs(n - 1) + climbStairs(n - 2);</div>
        <div class="cm-line">}</div>
      </div>
    </div>
  </div>
</body>
</html>
