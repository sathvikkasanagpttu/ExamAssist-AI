<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moodle Quiz Fixture</title>
</head>
<body class="path-mod-quiz">
  <div id="quiz-container" class="que multichoice">
    <div class="formulation">
      <div id="moodle-qtext" class="qtext">What is the worst-case time complexity of searching for a key in a balanced Binary Search Tree (AVL Tree) with n nodes?</div>
      <div class="answer">
        <div class="r0"><input type="radio" name="q1" id="optA" /><label for="optA">A. O(1)</label></div>
        <div class="r1"><input type="radio" name="q1" id="optB" /><label for="optB">B. O(log n)</label></div>
        <div class="r0"><input type="radio" name="q1" id="optC" /><label for="optC">C. O(n)</label></div>
        <div class="r1"><input type="radio" name="q1" id="optD" /><label for="optD">D. O(n log n)</label></div>
      </div>
    </div>
  </div>
</body>
</html>
