<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ExamAI Settings</title>
  <style>
    body {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #93c5fd;
      border-radius: 6px;
      text-transform: uppercase;
    }
    p {
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #cbd5e1;
      font-size: 13px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 16px;
      user-select: none;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: 0;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    #save {
      background: #2563eb;
      color: #fff;
    }
    #save:hover {
      background: #1d4ed8;
    }
    #test {
      background: #334155;
      color: #cbd5e1;
    }
    #test:hover {
      background: #475569;
      color: #fff;
    }
    #status {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    .status-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <h1>
    ExamAI Settings
    <span class="badge">Evidence-First</span>
  </h1>
  <p>Configure the local API server and extension behavior.</p>

  <div class="card">
    <label for="api">Backend Server URL</label>
    <input id="api" type="text" placeholder="http://localhost:8787">
    <small style="color: #64748b; display: block; margin-top: 4px;">Default is http://localhost:8787.</small>

    <label class="checkbox-label">
      <input id="autoCopy" type="checkbox">
      <span>Automatically research question when text is copied</span>
    </label>

    <label class="checkbox-label">
      <input id="showFloating" type="checkbox">
      <span>Show floating 'Research with ExamAI' button on text selection</span>
    </label>

    <label class="checkbox-label">
      <input id="autoDetectOptions" type="checkbox">
      <span>Auto-detect multiple-choice options from assessment page elements</span>
    </label>

    <div class="btn-group">
      <button id="save">Save Settings</button>
      <button id="test">Test Connection</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
