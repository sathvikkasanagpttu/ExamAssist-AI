<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ExamAssist AI Copilot</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      text-transform: uppercase;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .status-online {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .banner-warning {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.35);
      color: #fde047;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .site-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .site-domain {
      font-weight: 600;
      color: #93c5fd;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-toggle-site {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #3b82f6;
      background: #2563eb;
      color: #fff;
    }
    .btn-toggle-site.enabled {
      background: #059669;
      border-color: #10b981;
    }
    .muted {
      color: #94a3b8;
      font-size: 12px;
      margin: 0 0 10px 0;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      height: 68px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 12.5px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus {
      border-color: #3b82f6;
    }
    .btn-primary {
      width: 100%;
      padding: 9px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .controls {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #334155;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="head">
    <h2>ExamAssist AI</h2>
    <span id="server-status" class="status-pill">Connecting…</span>
  </div>

  <div id="ai-warning" class="banner-warning">
    ⚠️ <strong>AI Not Configured:</strong> Add <code>OPENAI_API_KEY</code> in <code>server/.env</code> to enable AI reasoning.
  </div>

  <div class="site-card">
    <div>
      <span style="color:#94a3b8;font-size:11px;display:block;">Current Site</span>
      <span id="siteDomain" class="site-domain">Loading…</span>
    </div>
    <button id="siteToggleBtn" class="btn-toggle-site">Enable on this site</button>
  </div>

  <p class="muted">
    Select question text on page to analyze, or paste prompt below:
  </p>

  <textarea id="questionInput" placeholder="Paste practice question & options here…"></textarea>
  <button id="askBtn" class="btn-primary">Analyze on Current Page</button>

  <div class="controls">
    <label>
      <input id="floatingToggle" type="checkbox">
      <span>Show floating button on text selection</span>
    </label>
    <label>
      <input id="allSitesToggle" type="checkbox">
      <span>Enable assistant on all websites</span>
    </label>
    <label>
      <input id="autoCopyToggle" type="checkbox">
      <span>Auto-analyze on copy (disabled by default)</span>
    </label>
    <button id="optionsBtn" class="btn-secondary">Settings & Configuration</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
